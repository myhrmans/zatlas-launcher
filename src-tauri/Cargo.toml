[package]
name = "zatlas"
version = "0.1.0"
description = "Join DayZ servers with their mods, and see which servers your friends are on"
edition = "2024"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
tauri = { version = "2.12.5", features = [] }
tauri-plugin-opener = "2.7.2"
tauri-plugin-deep-link = "2.6.2"
tauri-plugin-single-instance = { version = "2.5.4", features = ["deep-link"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
steamworks = "0.13.1"
steamworks-sys = "0.13.0"
ureq = { version = "3.5.0", features = ["json"] }
junction = "2.1.0"
sysinfo = "0.39.6"
winreg = "0.56.0"
pelite = "0.10.0"
png = "0.17"
base64 = "0.22"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging"] }
